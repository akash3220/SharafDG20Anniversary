<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" content="width=device-width,minimum-scale=1,maximum-scale=1" name="viewport">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="theme-color" content="#0dbdca">

    <meta property="fb:app_id" content="263249457569822">
    <meta property="og:url" content="https://www.newsfeedsmartapp.com/SharafDG20">

    <meta name="author" content="SharafDG">

        content="Try the SWVL Easter Hunt game today to stand a chance to win 5 free SWVL rides!"> -->

        content="Try the SWVL Easter Hunt game today to stand a chance to win 5 free SWVL rides!" /> -->

    <link rel="icon" type="image/png" href="https://www.newsfeedsmartapp.com/SharafDG20/favicon.png">

</head>

<body>

    <div id="mainDiv">

        <div id="loader">
            <div class="spinner"></div>
        </div>

        <div id="logo" style="opacity: 0;">
            <!-- <img  id="img" src="./assets/logo/logo (1).png" alt="" style="width: 100%;"> -->
        </div>

        <div id="soundIcon" style="opacity: 0;">
            <img src="./assets/s1.png" alt="SoundIcon" style="width: 100%;">
        </div>

        <div id="firstScreen" style="display: block; opacity: 0; ">
            <div id="twenty_Div"></div>
            <div id="charcter_Div" style="opacity: 0;">
                <div id="star_Div">
                    <img src="./assets/star.png" alt="Star" style="width: 100%;">
                </div>
                <!-- <div id="arrow_Div">
                    <img src="./assets/arrow.png" alt="Arrow" style="width: 100%;">
                </div> -->
                <div id="playPuzzle_Div">
                </div>
            </div>
            <div id="startButtonBg">
                <div id="startText_Div">START
                    <div id="startArrow_Div">
                        <img src="./assets/Start_arrow.png" alt="Start_arrow.png" style="width: 100%;">
                    </div>
                </div>
            </div>
        </div>

        <div id="formPage" style="display: flex; opacity: 0;">
            <div id="formPageText">ENTER YOUR DETAILS</div>
            <div id="input1" class="input-wrapper">
                <label for="name">Name</label>
                <div class="input-bg">
                    <img src="./assets/inputbox.png" alt="InputBox" style="width: 100%;">
                    <input type="text" id="name">
                </div>
            </div>

            <div id="input2" class="input-wrapper">
                <label for="name">Email</label>
                <div class="input-bg">
                    <img src="./assets/inputbox.png" alt="InputBox" style="width: 100%;">
                    <input type="email" id="email">
                </div>
            </div>

            <div id="input3" class="input-wrapper">
                <label for="name">Phone Number</label>
                <div class="input-bg">
                    <img src="./assets/inputbox.png" alt="InputBox" style="width: 100%;">
                    <input type="text" id="mobile">
                </div>
            </div>

            <div id="input4" class="input-wrapper">
                <!-- <label for="name">ENTER YOUR UNIQUE CODE</label> -->
                <div id="uniqueCode_text">ENTER YOUR UNIQUE CODE</div>
                <div class="input-bg">
                    <img src="./assets/unique code box.png" alt="InputBox" style="width: 100%;">
                    <input type="text" id="uniqueCode">
                </div>
                <div id="Popup">
                    Invalid Code
                </div>

                <div id="TAndC_Div">
                    <div id="TickImage_Div">
                        <img id="tickImage" src="./assets/t1.png" alt="TickImage" style="width: 100%;">
                    </div>
                    <div id="accept_Text">
                        I accept the
                        <a href="www.google.com" target="_blank"
                            style="text-decoration: underline; color: white; cursor: pointer;">T&C</a>
                        and
                        <a href="www.google.com" target="_blank"
                            style="text-decoration: underline; color: white; cursor: pointer;">Privacy Notice</a>.
                    </div>
                </div>
            </div>


            <div id="submitButtonBg">
                <button id="submitButton">SUBMIT</button>
            </div>
        </div>
        <!-- <div id="prizeText">You have won a <br><span>Samsung 65Q60 TV </span><br>1328931</div> -->

        <div id="prizePage" style="opacity: 0;">
            <div id="congrts_Text">CONGRATULATIONS!</div>
            <div id="prizeBg">
                <img id="prizeImg" src="" alt="PrixwImage" style="width: 100%;">
                <div id="prizeText"></div>
                <div id="uniqueCodeBg">
                    <img src="./assets/unique code box.png" alt="unique code box" style="width: 100%; opacity: 1;">
                    <div id="UniqueCodeText"></div>

                </div>

            </div>
        </div>

        <audio id="bgMusic" src="./assets/SharafDGBGM.mp3" preload="auto" loop autoplay></audio>
        <div id="errorPopup"></div>
        <div id="confetti-container"></div>
        <div id="balloonContainer"></div>
    </div>


    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const bgMusic = document.getElementById('bgMusic');
            document.body.addEventListener('click', function () {
                if (bgMusic.paused) {
                    bgMusic.play().catch(error => console.error('Audio play failed:', error));
                }
            }, { once: true });
        });
    </script>


</body>

</html>
